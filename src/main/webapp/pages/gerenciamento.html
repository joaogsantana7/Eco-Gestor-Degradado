<!DOCTYPE html>
    <head>
        <link rel="stylesheet" href="../css/reset.css"/>
        <link rel="stylesheet" href="../css/color.css"/>
        <link rel="stylesheet" href="../css/geremciamento.css"/>
        <title>Dashboard</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header id="header">
            <h1 id="tituloDashboard">Sistema de estoque</h1>
            <div id = "topoGerenciamento">
                <div class = "linkTopo">
                    <a href="dashboard.html"> inicio </a>
                </div>

                <div class = "linkTopo">
                    <a href="cadastro.html"> Cadastro Usuario </a>
                </div>
                
                <div class = "linkTopo">
                    <a href="cadastroProdutos.html"> Cadastro Produto </a>
                </div>
            </div>
        </header>

        <main>

            <section id="resumoEstoque">
                <div class="card-resumo">
                    <h2 class="titulo-card">Entrada</h2>
                    <p class="valor-card" id="cardEntrada">0</p>
                </div>

                <div class="card-resumo">
                    <h2 class="titulo-card">Saída</h2>
                    <p class="valor-card" id="cardSaida">0</p>
                </div>

                <div class="card-resumo">
                    <h2 class="titulo-card">Total</h2>
                    <p class="valor-card" id="cardTotal">0</p>
                </div>
            </section>

            <section id="modificarProduto">
                <h2>Modificar Produto</h2>

                <form action="#" method="post">

                    <div class="campo">
                        <label for="codigoBarras">Código de Barras</label>
                        <input
                            type="text"
                            id="codigoBarras"
                            name="codigoBarras"
                            placeholder="Digite o código de barras"
                            required>
                    </div>

                    <div class="campo">
                        <label for="nomeProduto">Nome do Produto</label>
                        <input
                            type="text"
                            id="nomeProduto"
                            name="nomeProduto"
                            placeholder="Digite o nome do produto"
                            required>
                    </div>

                    <div class="campo">
                        <label for="movimentacao">Tipo de Movimentação</label>
                        <select id="movimentacao" name="movimentacao" required>
                            <option value="">Selecione</option>
                            <option value="entrada">Entrada</option>
                            <option value="saida">Saída</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="quantidade">Quantidade</label>
                        <input
                            type="number"
                            id="quantidade"
                            name="quantidade"
                            min="1"
                            placeholder="Informe a quantidade"
                            required>
                    </div>

                    <button type="submit">Confirmar Alteração</button>

                </form>
            </section>

            <section id="tabelaEstoqueContainer">
                <div class="tabela-wrapper">
                    <table id="tabelaEstoque">
                        <thead>
                            <tr>
                                <th>Código de barras</th>
                                <th>Nome</th>
                                <th>Fabricante</th>
                                <th>Marca</th>
                                <th>Quantidade</th>
                                <th>Valor unitário</th>
                                <th>Total</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela">
                            <tr class="linha-item">
                                <td>123456789</td>
                                <td>Mouse</td>
                                <td>Logitech</td>
                                <td>MX</td>
                                <td>10</td>
                                <td>R$80,00</td>
                                <td>R$800,00</td>
                            </tr>
                            <tr class="linha-item">
                                <td>123456780</td>
                                <td>Teclado</td>
                                <td>Logitech</td>
                                <td>MXC</td>
                                <td>10</td>
                                <td>R$90,00</td>
                                <td>R$900,00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

             <section id="paginacao">
                <div class="controle-paginacao">
                    <label for="pagina">Página</label>
                    <select id="pagina">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>
                <div class="conteiner-btn">
                    <button id="btnVoltar" class="btn-voltar">Voltar</button>
                    <button id="btnProximo" class="btn-proximo">Próximo</button>
                </div>
            </section>



        </main>

        <script src="../js/gerenciamento.js"></script>

    </body>
</html>
